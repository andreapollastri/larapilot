<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Filament</title>
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=inter:400,500,600,700" rel="stylesheet">
  <link rel="stylesheet" href="../tokens.css">
</head>
<body class="fi-mockup">
  <main class="fi-login-page">
    <div class="fi-login-card">
      <div class="fi-login-card__brand">Filament Demo</div>
      <h1>Sign in</h1>
      <!-- A picture of the sign-in screen: no form element, no input for credentials. -->
      <div class="mock-form">
        <div class="fi-field">
          <span class="mock-label">Email</span>
          <div class="mock-field" role="img" aria-label="Email field, filled in">anna@example.com</div>
        </div>
        <div class="fi-field">
          <span class="mock-label">Password</span>
          <div class="mock-field mock-field--secret" role="img" aria-label="Password field, filled in">••••••••••</div>
        </div>
        <div class="fi-field fi-checkbox">
          <input id="remember" type="checkbox">
          <label for="remember">Remember me</label>
        </div>
        <a href="dashboard.html" class="fi-btn fi-btn--primary" role="button">Sign in</a>
        <p style="text-align:center;margin-top:1rem;font-size:0.8125rem">
          <a href="#" style="color:rgb(var(--color-primary-600))">Forgot your password?</a>
        </p>
      </div>
    </div>
  </main>
</body>
</html>

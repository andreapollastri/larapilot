<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Bootstrap 5</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../tokens.css">
  <style>
    /* Credential fields are drawn, not built — see the mockup rules. */
    .mock-field { display: flex; align-items: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .mock-field--secret { letter-spacing: 0.18em; }
  </style>
</head>
<body class="bs-mockup d-flex align-items-center min-vh-100 bg-body-tertiary">
  <main class="container" style="max-width: 24rem">
    <div class="text-center mb-4">
      <a href="landing.html" class="text-decoration-none fw-bold fs-5 text-primary">Acme SaaS</a>
    </div>
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 text-center mb-1">Sign in</h1>
        <p class="text-secondary text-center small mb-4">Welcome back — sign in to continue.</p>
        <!-- A picture of the sign-in screen: no form element, no input for credentials. -->
        <div class="mock-form">
          <div class="mb-3">
            <span class="form-label d-block">Email</span>
            <div class="form-control mock-field" role="img" aria-label="Email field, filled in">jane@example.com</div>
          </div>
          <div class="mb-3">
            <span class="form-label d-block">Password</span>
            <div class="form-control mock-field mock-field--secret" role="img" aria-label="Password field, filled in">••••••••••</div>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label" for="remember">Remember me</label>
          </div>
          <a href="dashboard.html" class="btn btn-primary w-100" role="button">Log in</a>
        </div>
        <p class="text-center small text-secondary mt-3 mb-0">
          <a href="#">Forgot your password?</a> · <a href="landing.html">Back to site</a>
        </p>
      </div>
    </div>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Laravel Starter Kit</title>
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=instrument-sans:400,500,600,700" rel="stylesheet">
  <link rel="stylesheet" href="../tokens.css">
</head>
<body class="sk-mockup">
  <main class="sk-auth-page">
    <div class="sk-auth-card">
      <h1>Log in to your account</h1>
      <p class="sk-auth-card__desc">Static sign-in preview — fields are placeholders only.</p>
      <form action="#" method="post" autocomplete="off" novalidate>
        <div class="sk-field">
          <label for="signin-email">Work email</label>
          <input id="signin-email" name="signin-email" type="email" class="sk-input" autocomplete="off" inputmode="email" placeholder="you@example.com" data-1p-ignore data-lpignore="true" required>
        </div>
        <div class="sk-field">
          <label for="signin-code">Access code</label>
          <input id="signin-code" name="signin-code" type="text" class="sk-input demo-secret-field" autocomplete="off" placeholder="Demo only" data-1p-ignore data-lpignore="true" required>
        </div>
        <div class="sk-field sk-checkbox">
          <input id="remember" name="remember" type="checkbox">
          <label for="remember">Remember me</label>
        </div>
        <button type="submit" class="sk-btn sk-btn--primary sk-btn--block">Log in</button>
        <p style="text-align:center;margin-top:1rem;font-size:0.8125rem" class="sk-muted">
          <a href="#" class="sk-btn--link" style="padding:0">Need help signing in?</a>
        </p>
        <p style="text-align:center;margin-top:0.75rem;font-size:0.8125rem" class="sk-muted">
          Don't have an account? <a href="#" class="sk-btn--link" style="padding:0">Sign up</a>
        </p>
      </form>
    </div>
  </main>
</body>
</html>

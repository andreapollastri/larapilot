name: tests

# Skills and runtime packs under resources/ are covered by the suite, so only
# the files no test reads are left out.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "netlify.toml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "netlify.toml"

# A newer push to the same branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_NO_AUDIT: 1
  COMPOSER_PROCESS_TIMEOUT: 0

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # The lowest and the highest PHP each Laravel line supports; the
      # versions in between add minutes, not coverage.
      matrix:
        include:
          - php: "8.1"
            laravel: "10.*"
            testbench: "8.*"
          - php: "8.3"
            laravel: "10.*"
            testbench: "8.*"
          - php: "8.2"
            laravel: "11.*"
            testbench: "9.*"
          - php: "8.3"
            laravel: "11.*"
            testbench: "9.*"
          - php: "8.3"
            laravel: "12.*"
            testbench: "10.*"
          - php: "8.4"
            laravel: "12.*"
            testbench: "10.*"
          - php: "8.4"
            laravel: "13.*"
            testbench: "11.*"
          - php: "8.5"
            laravel: "13.*"
            testbench: "11.*"

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: |
          # Laravel 10/11 are past their security-fix window. Composer 2.9+
          # blocks every 10.x/11.x laravel/framework release because the open
          # advisories have no patched line. Compatibility CI only — other
          # packages stay blocked. Drop this once a patched 10/11 ships (or
          # those majors are dropped).
          if [[ "${{ matrix.php }}" == "8.1" ]]; then
            # PHP 8.1 can only install Pest 2.36.0, which conflicts with
            # phpunit >=10.5.62 — and every earlier phpunit 10.x release
            # carries an open advisory (CVE-2026-24765, PHPT coverage
            # deserialization; irrelevant to this suite). Ignore it here or
            # nothing resolves on 8.1.
            composer config --json policy.advisories.ignore '["laravel/framework", "phpunit/phpunit"]'
          elif [[ "${{ matrix.laravel }}" == 10.* || "${{ matrix.laravel }}" == 11.* ]]; then
            composer config --json policy.advisories.ignore '["laravel/framework"]'
          fi
          composer require "illuminate/support:${{ matrix.laravel }}" --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update
          composer update --prefer-dist --no-progress --no-scripts
          composer dump-autoload --classmap-authoritative

      - name: Run tests
        run: vendor/bin/pest --ci

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Lint & static analysis

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none
          tools: composer:v2

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-lint-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-lint-

      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-progress --no-scripts
          composer dump-autoload --classmap-authoritative

      - name: PHPStan result cache
        uses: actions/cache@v4
        with:
          path: /tmp/phpstan
          key: phpstan-${{ github.sha }}
          restore-keys: phpstan-

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
